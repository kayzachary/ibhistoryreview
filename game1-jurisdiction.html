<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Court? — Jurisdiction Sorter</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{background:#FAF5EA;color:#1A202C;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .vocab{color:#EA580C;font-weight:800}
  .btn{transition:transform .08s ease, box-shadow .08s ease}
  .btn:active{transform:translateY(2px)}
  .bucket{background:#FFFBEF;border:4px solid #1E3A8A;color:#1E3A8A}
  .bucket:hover{background:#FEF3C7;transform:translateY(-2px);box-shadow:0 6px 0 #1E3A8A}
  .correct-panel{background:#DCFCE7;border:5px solid #16A34A;color:#14532D}
  .wrong-panel{background:#FEE2E2;border:5px solid #DC2626;color:#7F1D1D}
  .tip{background:#ECFCCB;border-left:10px solid #65A30D;color:#365314}
  .menu-bar{position:fixed;bottom:0;left:0;right:0;background:#1E3A8A;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:50}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .pulse-green{animation:pulseG .6s}
  @keyframes pulseG{0%{background:#DCFCE7}50%{background:#86EFAC}100%{background:#DCFCE7}}
</style>
</head>
<body class="min-h-screen pb-20">
<div id="app"></div>

<script>
// ========= AUDIO =========
let ctx;
function initAudio(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f,d,t='sine',v=0.25){
  initAudio();
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=t; o.frequency.value=f;
  g.gain.setValueAtTime(v,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);
  o.connect(g).connect(ctx.destination);
  o.start(); o.stop(ctx.currentTime+d);
}
function sfxClick(){tone(620,0.05)}
function sfxCorrect(){tone(659,0.12);setTimeout(()=>tone(988,0.22),110)}
function sfxWrong(){tone(180,0.35,'sawtooth',0.2)}
function sfxWin(){[523,659,784,1047,1318].forEach((f,i)=>setTimeout(()=>tone(f,0.22),i*140))}

// ========= VOCAB HIGHLIGHT =========
const VOCAB = ['jurisdiction','original jurisdiction','appellate jurisdiction','limited jurisdiction','general jurisdiction','federal','state','misdemeanor','felony','appeal'];
function hl(text){
  let out = text;
  const sorted = [...VOCAB].sort((a,b)=>b.length-a.length);
  sorted.forEach(w=>{
    const rx = new RegExp('\\b('+w.replace(/ /g,' ')+')\\b','gi');
    out = out.replace(rx,'<span class="vocab">$1</span>');
  });
  return out;
}

// ========= DATA =========
const COURTS = [
  'U.S. Supreme Court',
  'U.S. Court of Appeals (4th Circuit)',
  'U.S. District Court of Maryland',
  'Supreme Court of Maryland',
  'Appellate Court of Maryland',
  'Circuit Court (Maryland)',
  'District Court of Maryland'
];

const SCENARIOS = [
  {s:'Speeding ticket issued in Annapolis', c:'District Court of Maryland', why:'Traffic/minor violation; no jury; state law. District Court handles minor state matters.'},
  {s:'Custody dispute between divorced parents in PG County', c:'Circuit Court (Maryland)', why:'Family law is a major state matter. Circuit Court handles divorce, custody, and major state cases.'},
  {s:'Federal surveillance program challenged as a 4th Amendment violation', c:'U.S. District Court of Maryland', why:'Federal constitutional issue → federal trial court. U.S. District Courts are the federal trial courts.'},
  {s:'Maryland and Virginia dispute over the Chesapeake Bay boundary', c:'U.S. Supreme Court', why:'State vs. state disputes fall under the original jurisdiction of the U.S. Supreme Court.'},
  {s:'Felony armed robbery in Baltimore', c:'Circuit Court (Maryland)', why:'Major criminal, jury trial, state law. Circuit Court is the trial court for felonies in Maryland.'},
  {s:'Small claims case between neighbors over $2,000 fence damage', c:'District Court of Maryland', why:'Small claims (under $5,000) and minor civil matters go to District Court of MD.'},
  {s:'Appeal of a Circuit Court ruling on a contract dispute', c:'Appellate Court of Maryland', why:'First level of MD appeals: Circuit Court → Appellate Court of Maryland.'},
  {s:'Final appeal of a Maryland state constitutional question', c:'Supreme Court of Maryland', why:'Highest MD court. It is the final authority on Maryland state constitutional issues.'},
  {s:'Copyright infringement lawsuit between two companies', c:'U.S. District Court of Maryland', why:'Copyright is federal law → federal trial court has jurisdiction.'},
  {s:'Appeal of a federal District Court ruling in Maryland', c:'U.S. Court of Appeals (4th Circuit)', why:'Maryland is in the 4th Circuit. Federal appeals go to the Court of Appeals for that circuit.'},
  {s:'Shoplifting misdemeanor in Annapolis Mall', c:'District Court of Maryland', why:'Misdemeanor, no jury trial in District Court. Minor criminal = District Court of MD.'},
  {s:'Divorce filing in Anne Arundel County', c:'Circuit Court (Maryland)', why:'Family law (divorce) is handled by the Circuit Court in Maryland.'},
  {s:'Challenge claiming a MD state law violates the federal Constitution', c:'U.S. District Court of Maryland', why:'Federal constitutional question → federal trial court (U.S. District Court).'},
  {s:'Final appeal of a case decided by the U.S. Court of Appeals', c:'U.S. Supreme Court', why:'Final federal appeal goes to SCOTUS (appellate jurisdiction).'},
  {s:'Traffic violation appealed from District Court', c:'Circuit Court (Maryland)', why:'MD appeals path: District Court → Circuit Court (de novo appeal).'},
  {s:'Murder trial in Montgomery County', c:'Circuit Court (Maryland)', why:'Felony trial with jury → Circuit Court. Major criminal cases are handled there.'},
  {s:'Immigration case involving federal deportation order', c:'U.S. District Court of Maryland', why:'Immigration is federal law — federal trial court has jurisdiction.'}
];

// ========= STATE =========
let state = {
  screen:'title',
  idx:0,
  scoreP1:0,
  scoreP2:0,
  twoPlayer:false,
  currentPlayer:1,
  feedback:null, // {correct:bool, msg:string, bucket:string}
  order:[]
};

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }

// ========= RENDER =========
const app = document.getElementById('app');

function menuBar(){
  return `<div class="menu-bar text-2xl">
    <button onclick="goTitle()" class="btn bg-white text-blue-900 font-black px-5 py-2 rounded-lg">&larr; Main Menu</button>
    <div class="font-bold">Game 1 — Which Court?</div>
    <div class="font-mono">${state.twoPlayer?`P1:${state.scoreP1}  P2:${state.scoreP2}  |  Turn: P${state.currentPlayer}`:`Score: ${state.scoreP1}`}</div>
  </div>`;
}

function renderTitle(){
  app.innerHTML = `
  <div class="p-10 max-w-6xl mx-auto">
    <h1 class="text-7xl font-black text-blue-900 mb-4">Which Court?</h1>
    <h2 class="text-4xl text-orange-600 font-bold mb-8">Jurisdiction Sorter</h2>
    <div class="bg-white border-4 border-blue-900 rounded-2xl p-8 text-3xl leading-relaxed mb-6">
      <p class="mb-4"><b>How to play:</b> Read the scenario at the top. Click the court that has the correct <span class="vocab">jurisdiction</span>.</p>
      <p class="mb-4">15+ scenarios covering Maryland courts and federal courts. Learn why each case goes where it does.</p>
      <p><b>Goal:</b> Get the most correct answers.</p>
    </div>
    <div class="tip p-6 text-3xl rounded-xl mb-8">
      <b>Tip:</b> <span class="vocab">Federal</span> courts = limited jurisdiction (Constitution, federal law, states as parties). <span class="vocab">State</span> courts = general jurisdiction (most criminal + civil cases). MD is in the <b>4th Circuit</b>.
    </div>
    <div class="flex gap-6 flex-wrap">
      <button onclick="startGame(false)" class="btn bg-blue-900 text-white text-4xl font-black px-10 py-6 rounded-2xl shadow-lg">1 Player</button>
      <button onclick="startGame(true)" class="btn bg-orange-600 text-white text-4xl font-black px-10 py-6 rounded-2xl shadow-lg">2 Players</button>
    </div>
  </div>`;
}

function renderGame(){
  const sc = state.order[state.idx];
  const fb = state.feedback;
  app.innerHTML = `
  <div class="p-6 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <div class="text-2xl font-bold text-blue-900">Scenario ${state.idx+1} of ${state.order.length}</div>
      ${state.twoPlayer?`<div class="text-3xl font-black ${state.currentPlayer===1?'text-blue-900':'text-orange-600'}">Player ${state.currentPlayer}'s turn</div>`:''}
    </div>
    <div class="bg-white border-4 border-blue-900 rounded-2xl p-8 mb-6">
      <div class="text-4xl font-bold leading-snug">${hl(sc.s)}</div>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-6">
      ${COURTS.map(c=>{
        const isWrong = fb && !fb.correct && fb.bucket===c;
        const isRight = fb && fb.correct && fb.bucket===c;
        const showAsAnswer = fb && !fb.correct && c===sc.c;
        return `<button onclick="pickBucket('${c.replace(/'/g,"\\'")}')" ${fb?'disabled':''}
          class="btn bucket rounded-2xl p-6 text-2xl font-black text-left ${isWrong?'shake border-red-600 bg-red-100':''} ${isRight||showAsAnswer?'pulse-green border-green-600 bg-green-100 text-green-900':''}">${c}</button>`;
      }).join('')}
    </div>
    ${fb?renderFeedback(fb,sc):''}
  </div>
  ${menuBar()}`;
}

function renderFeedback(fb,sc){
  if(fb.correct){
    return `<div class="correct-panel rounded-2xl p-8 mb-6">
      <div class="text-5xl font-black mb-3">✓ Correct!</div>
      <div class="text-3xl mb-4 leading-snug">${hl(sc.why)}</div>
      <button onclick="nextScenario()" class="btn bg-green-700 text-white text-3xl font-black px-8 py-4 rounded-xl">NEXT &rarr; (Enter)</button>
    </div>`;
  }
  return `<div class="wrong-panel rounded-2xl p-8 mb-6">
    <div class="text-5xl font-black mb-3">✗ Not quite</div>
    <div class="text-3xl mb-2"><b>Correct court:</b> ${sc.c}</div>
    <div class="text-3xl mb-4 leading-snug">${hl(sc.why)}</div>
    <button onclick="nextScenario()" class="btn bg-red-700 text-white text-3xl font-black px-8 py-4 rounded-xl">NEXT &rarr; (Enter)</button>
  </div>`;
}

function renderWin(){
  const total = state.order.length;
  let summary;
  if(state.twoPlayer){
    const winner = state.scoreP1>state.scoreP2?'Player 1 Wins!':state.scoreP2>state.scoreP1?'Player 2 Wins!':'Tie Game!';
    summary = `<div class="text-5xl font-black text-orange-600 mb-4">${winner}</div>
      <div class="text-3xl mb-2">Player 1: ${state.scoreP1}/${total}</div>
      <div class="text-3xl mb-6">Player 2: ${state.scoreP2}/${total}</div>`;
  } else {
    summary = `<div class="text-5xl font-black text-green-700 mb-6">You scored ${state.scoreP1} / ${total}</div>`;
  }
  app.innerHTML = `
  <div class="p-10 max-w-6xl mx-auto">
    <h1 class="text-7xl font-black text-blue-900 mb-6">Study Guide</h1>
    ${summary}
    <div class="bg-white border-4 border-blue-900 rounded-2xl p-8 text-3xl leading-relaxed mb-6">
      <ul class="list-disc pl-8 space-y-3">
        <li><b><span class="vocab">Federal</span> courts = limited jurisdiction</b> (Constitution, federal law, states as parties, federal crimes)</li>
        <li><b><span class="vocab">State</span> courts = general jurisdiction</b> (most criminal + civil cases)</li>
        <li><b>MD path:</b> District &rarr; Circuit &rarr; Appellate &rarr; Supreme of MD</li>
        <li><b>Federal path:</b> District &rarr; Court of Appeals &rarr; U.S. Supreme Court</li>
        <li><b>MD is in the 4th Circuit</b></li>
        <li><span class="vocab">Original jurisdiction</span>: court hears it first. <span class="vocab">Appellate jurisdiction</span>: court hears appeals.</li>
      </ul>
    </div>
    <div class="flex gap-4">
      <button onclick="startGame(state.twoPlayer)" class="btn bg-blue-900 text-white text-3xl font-black px-8 py-5 rounded-2xl">Play Again</button>
      <button onclick="goTitle()" class="btn bg-orange-600 text-white text-3xl font-black px-8 py-5 rounded-2xl">Title Screen</button>
      <a href="index.html" class="btn bg-gray-700 text-white text-3xl font-black px-8 py-5 rounded-2xl">Main Menu</a>
    </div>
  </div>`;
  sfxWin();
}

// ========= ACTIONS =========
function goTitle(){ sfxClick(); state={screen:'title',idx:0,scoreP1:0,scoreP2:0,twoPlayer:false,currentPlayer:1,feedback:null,order:[]}; renderTitle(); }
function startGame(twoPlayer){
  sfxClick();
  state.twoPlayer = twoPlayer;
  state.scoreP1=0; state.scoreP2=0; state.currentPlayer=1; state.idx=0; state.feedback=null;
  state.order = shuffle(SCENARIOS).slice(0,15);
  state.screen='game';
  renderGame();
}
function pickBucket(c){
  const sc = state.order[state.idx];
  const correct = c === sc.c;
  if(correct){ sfxCorrect(); if(state.currentPlayer===1) state.scoreP1++; else state.scoreP2++; }
  else sfxWrong();
  state.feedback = {correct, bucket:c};
  renderGame();
}
function nextScenario(){
  sfxClick();
  state.feedback=null;
  if(state.twoPlayer) state.currentPlayer = state.currentPlayer===1?2:1;
  state.idx++;
  if(state.idx >= state.order.length){ state.screen='win'; renderWin(); }
  else renderGame();
}

document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && state.feedback){ e.preventDefault(); nextScenario(); }
});

renderTitle();
</script>
</body>
</html>
